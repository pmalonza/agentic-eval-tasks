[eligibility]
note = "Single-paper Code Generation task. Main paper published 2026-02-24, after this session's own model knowledge cutoff (2026-01) and very likely after the calibration models' cutoffs too -- the method cannot have been memorized from training. Only two of the paper's components are used (the Section 2 Earned Contract formula, and the Section 6.1 warranty-exclusion exposure concept); the paper's own GLM loss-cost modeling and probabilistic lognormal mileage-exposure machinery are deliberately NOT reproduced -- see README.md for why (equation rendering issue during authoring) and how the task was scoped down to a fully deterministic, single-golden-answer adaptation instead."
